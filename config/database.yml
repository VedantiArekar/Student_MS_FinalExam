
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "student_ms_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_TEST_NAME", "student_ms_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "student_ms_production") %>
