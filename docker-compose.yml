# Starts the whole application: PostgreSQL database + Rails web server.
#
#   1. cp .env.example .env      (and change the values)
#   2. docker compose up --build
#   3. open http://localhost:3000

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is missing - copy .env.example to .env}
      POSTGRES_USER: ${DB_USER:?DB_USER is missing - copy .env.example to .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing - copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data   # keeps the data after a restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db            # "db" is the name of the database service above
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is missing - copy .env.example to .env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
