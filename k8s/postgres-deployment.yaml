
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-postgres
  namespace: student-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-postgres
  template:
    metadata:
      labels:
        app: student-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: student-db-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: student-postgres-pvc
